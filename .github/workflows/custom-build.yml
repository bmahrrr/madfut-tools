name: Custom build

on:
  push:
    branches: [main]
    paths:
      - "config/requests/*.json"
  workflow_dispatch:
    inputs:
      file:
        description: "Request file, e.g. config/requests/beat-79.json"
        required: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        run: |
          if [ -n "${{ github.event.inputs.file }}" ]; then
            FILES='["${{ github.event.inputs.file }}"]'
          else
            FILES=$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'config/requests/*.json' \
                    | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          fi
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "$FILES"

  build:
    needs: plan
    if: ${{ needs.plan.outputs.files != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.plan.outputs.files) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build.py request "${{ matrix.file }}"
      - id: name
        run: |
          echo "stem=$(basename '${{ matrix.file }}' .json)" >> $GITHUB_OUTPUT
          # a "rebuild" request (Don't have on the site) replaces that series' weekly team
          OUT=$(python3 -c "import json;r=json.load(open('${{ matrix.file }}'));print(f\"docs/results/mine/{r.get('kind','myclub')}_{r['series']}.json\" if r.get('mode')=='rebuild' else '')")
          echo "out=$OUT" >> $GITHUB_OUTPUT
          if [ -n "$OUT" ] && [ "${OUT#docs/results/mine/myclub_}" != "$OUT" ]; then node scripts/plan.js "$OUT" || echo "game plan failed"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: custom_${{ steps.name.outputs.stem }}
          path: ${{ steps.name.outputs.out || format('docs/results/custom_{0}.json', steps.name.outputs.stem) }}

  publish:
    needs: build
    if: ${{ always() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Save results
        run: |
          git config user.name "madfut-tools bot"
          git config user.email "actions@users.noreply.github.com"
          # Several builds can finish at once (e.g. quick taps on Don't have / Got): retry on the latest main,
          # and never let an older personal rebuild overwrite a newer one.
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p docs/results/mine
            for f in $(find artifacts -name '*.json'); do
              case "$(basename $(dirname $f))" in
                custom_rebuild-*)
                  dest="docs/results/mine/$(basename $f)"
                  python3 - "$f" "$dest" <<'PY' && cp "$f" "$dest"
          import json, os, sys
          new = json.load(open(sys.argv[1])).get("request_created", "")
          old = json.load(open(sys.argv[2])).get("request_created", "") if os.path.exists(sys.argv[2]) else ""
          sys.exit(0 if new >= old else 1)     # skip: a newer request's result is already saved
          PY
                  ;;
                *) cp "$f" docs/results/ ;;
              esac
            done
            python3 scripts/build.py index
            git add docs/results
            git diff --cached --quiet && { echo "nothing new to save"; break; }
            git commit -qm "Custom build results" && git push -q origin HEAD:main && { echo "saved"; break; }
            echo "push raced with another build, retrying ($i)"; sleep $((5 + RANDOM % 15))
          done
