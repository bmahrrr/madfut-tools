name: Custom build

on:
  push:
    branches: [main]
    paths:
      - "config/requests/*.json"
  workflow_dispatch:
    inputs:
      file:
        description: "Request file, e.g. config/requests/beat-79.json"
        required: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        run: |
          if [ -n "${{ github.event.inputs.file }}" ]; then
            FILES='["${{ github.event.inputs.file }}"]'
          else
            FILES=$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'config/requests/*.json' \
                    | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          fi
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "$FILES"

  build:
    needs: plan
    if: ${{ needs.plan.outputs.files != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.plan.outputs.files) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build.py request "${{ matrix.file }}"
      - id: name
        run: echo "stem=$(basename '${{ matrix.file }}' .json)" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: custom_${{ steps.name.outputs.stem }}
          path: docs/results/custom_${{ steps.name.outputs.stem }}.json

  publish:
    needs: build
    if: ${{ always() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Save results
        run: |
          mkdir -p docs/results
          find artifacts -name '*.json' -exec cp {} docs/results/ \;
          python3 scripts/build.py index
          git config user.name "madfut-tools bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/results
          git diff --cached --quiet || (git commit -m "Custom build results" && git pull --rebase && git push)
