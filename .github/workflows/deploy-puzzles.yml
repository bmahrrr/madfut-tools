name: Deploy puzzles server
# The Puzzles leaderboard (Cloudflare Worker + D1). Needs two repo secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ["worker/**", "docs/puzzle-core.js", ".github/workflows/deploy-puzzles.yml"]
  workflow_dispatch: {}
concurrency: { group: deploy-puzzles, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets set?
        id: have
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repo secrets first." >> $GITHUB_STEP_SUMMARY; echo "ok=0" >> $GITHUB_OUTPUT; exit 0; fi
          # trim stray spaces / line breaks from pasting, and say plainly (without showing it) if a secret still looks wrong
          trim() { printf %s "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | tr -d '\n'; }
          T=$(trim "$CLOUDFLARE_API_TOKEN"); A=$(trim "$CLOUDFLARE_ACCOUNT_ID")
          case "$T" in *[[:space:]]*|*Bearer*|*curl*) echo "::error title=token::CLOUDFLARE_API_TOKEN has more than the token in it (length ${#T}). Paste only the token."; exit 1;; esac
          echo "$A" | grep -Eq '^[0-9a-f]{32}$' || { echo "::error title=account::CLOUDFLARE_ACCOUNT_ID should be 32 letters and numbers (got ${#A})."; exit 1; }
          echo "::add-mask::$T"; echo "CLOUDFLARE_API_TOKEN=$T" >> $GITHUB_ENV; echo "CLOUDFLARE_ACCOUNT_ID=$A" >> $GITHUB_ENV
          echo "::notice title=token::looks fine (length ${#T})"
          echo "ok=1" >> $GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        if: steps.have.outputs.ok == '1'
        with: { node-version: 20 }
      - name: Build
        if: steps.have.outputs.ok == '1'
        run: |
          npm i -g wrangler@4 >/dev/null 2>&1
          mkdir -p worker/dist
          (cat docs/sbc-solver.js; echo; cat docs/puzzle-core.js; echo; cat worker/src/main.js) > worker/dist/worker.js
      - name: Database
        if: steps.have.outputs.ok == '1'
        working-directory: worker
        run: |
          # any failure is shown as an error note on the run (readable without signing in)
          fail() { echo "::error title=$1::$(tail -c 900 log.txt | tr '\n' ' ')"; exit 1; }
          export WRANGLER_SEND_METRICS=false CI=true
          id() { wrangler d1 list --json 2>log.txt | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const i=s.indexOf("[");const x=i<0?null:JSON.parse(s.slice(i)).find(d=>d.name==="madfut-puzzles");process.stdout.write(x?x.uuid:"")})'; }
          ID=$(id) || fail "d1 list"
          if [ -z "$ID" ]; then wrangler d1 create madfut-puzzles >log.txt 2>&1 || fail "d1 create"; ID=$(id) || fail "d1 list"; fi
          [ -n "$ID" ] || fail "no database id"
          printf 'name = "madfut-puzzles"\nmain = "dist/worker.js"\ncompatibility_date = "2024-11-01"\nworkers_dev = true\n\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "madfut-puzzles"\ndatabase_id = "%s"\n' "$ID" > wrangler.toml
          wrangler d1 execute madfut-puzzles --remote --file=schema.sql >log.txt 2>&1 || fail "schema"
          echo "::notice title=database::ready $ID"
      - name: Deploy
        if: steps.have.outputs.ok == '1'
        working-directory: worker
        run: |
          wrangler deploy >log.txt 2>&1 || { echo "::error title=deploy::$(tail -c 900 log.txt | tr '\n' ' ')"; exit 1; }
          URL=$(grep -o 'https://[^ ]*workers.dev' log.txt | head -1)
          echo "Server: $URL" >> $GITHUB_STEP_SUMMARY
          echo "::notice title=server::$URL"
