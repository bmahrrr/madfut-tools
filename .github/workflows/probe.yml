name: Probe data sources
on:
  push:
    branches: [sim-rules]
    paths: ["probe/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py
      - run: |
          mkdir -p evodata && cp out/* evodata/
          git config user.name "madfut-tools bot"; git config user.email "actions@users.noreply.github.com"
          git add evodata && git commit -m "Evo data snapshot" && git push
