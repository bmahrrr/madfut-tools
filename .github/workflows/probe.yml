name: Probe card sources
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          set +e
          git show origin/main:scripts/update_data.py > /dev/null 2>&1
          git fetch -q origin main && git show origin/main:scripts/update_data.py > scripts/update_data.py
          python probe2.py > probe2.txt 2>&1
      - run: |
          git config user.name bot; git config user.email actions@users.noreply.github.com
          mkdir -p probe-out; cp probe2.txt probe-out/
          git add -f probe-out && git commit -m "probe output [skip ci]" && git push
