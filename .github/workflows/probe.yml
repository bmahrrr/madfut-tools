name: Probe name sources
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          exec > probe.txt 2>&1
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          mkdir -p js
          for page in 27/Cards.html 27/LTM-Cards.html 27/Evo-Chains.html 27/Upgrade-Hub.html 27/index.html; do
            echo "=== PAGE $page"; curl -sL -A "$UA" "https://madfutdata.com/$page" -o p.html; wc -c p.html
            grep -oE 'src="[^"]+"' p.html | sort -u
            for js in $(grep -oE 'src="[^"]+\.js[^"]*"' p.html | sed 's/src="//;s/"$//' | grep -v googlesynd | grep -v cdnjs); do
              case "$js" in http*) url="$js";; /*) url="https://madfutdata.com$js";; *) url="https://madfutdata.com/27/$js";; esac
              f="js/$(echo $url | tr '/:' '__')"; [ -f "$f" ] && continue
              curl -sL -A "$UA" "$url" -o "$f"; echo "--- JS $url $(wc -c < $f)"
              grep -oE "https?://[^\"' \`)]+" "$f" | sort -u | head -30
              grep -oE "[\"'\`][^\"'\`]*(json|documents/)[^\"'\`]*[\"'\`]" "$f" | sort -u | head -30
            done
          done
          echo "=== firestore guesses"
          for c in updates sbcs sbc evos evolutions ltm ltms potm objectives realm cards config players promos; do
            code=$(curl -s -o fs.json -w "%{http_code}" "https://firestore.googleapis.com/v1/projects/trivela-madfut/databases/%28default%29/documents/$c?pageSize=3"); echo "$c $code $(head -c 200 fs.json | tr '\n' ' ')"
          done
      - run: |
          git config user.name bot; git config user.email actions@users.noreply.github.com
          mkdir -p probe-out; cp probe.txt probe-out/; cp -r js probe-out/ 2>/dev/null || true
          git add -f probe-out && git commit -m "probe output [skip ci]" && git push
