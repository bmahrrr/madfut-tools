name: Puzzle top scores (Icons check)

# Proves every puzzle's top score with every card allowed, Icons and Heroes too, so nothing at all beats it (or finds
# the better squad), in two steps (scripts/pz_max.py prove2): the top with no Icons or Heroes, then that no squad with
# one beats it. Works through the puzzles not proven this way yet, up to 34 at a time, and starts itself again until
# none are left: first up to 2.5 hours a puzzle, then up to 5.5 hours for any not proven in that time.
on:
  push:
    branches: [main]
    paths: [".github/workflows/puzzle-icons.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: puzzle-icons
  cancel-in-progress: false   # the next block waits for the one running

jobs:
  list:
    runs-on: ubuntu-26.04
    outputs:
      ids: ${{ steps.l.outputs.ids }}
      minutes: ${{ steps.l.outputs.minutes }}
      timeout: ${{ steps.l.outputs.timeout }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }     # the latest top scores, not the ones when this run was started
      - id: l
        run: python3 scripts/pz_icons_next.py >> $GITHUB_OUTPUT

  prove:
    needs: list
    if: needs.list.outputs.ids != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ fromJSON(needs.list.outputs.timeout) }}
    strategy:
      fail-fast: false
      max-parallel: 34      # leaves machines free (the account runs 40 at once) so site updates don't queue
      matrix:
        id: ${{ fromJson(needs.list.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install ortools==9.15.6755
      - run: |
          node scripts/pz_max.js eligall elig.json
          python3 scripts/pz_max.py prove2 "${{ matrix.id }}" "$(( ${{ needs.list.outputs.minutes }} * 60 ))" elig.json "icons_${{ matrix.id }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icons-${{ matrix.id }}
          path: icons_${{ matrix.id }}.json
          if-no-files-found: ignore

  publish:
    needs: [list, prove]
    if: always() && needs.list.outputs.ids != '[]'
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
      BLOCK: ${{ needs.list.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { path: found, pattern: icons-*, merge-multiple: true }
      - run: |
          mkdir -p found
          # another top scores run saving at the same moment would clash: wait for it first
          for i in $(seq 1 90); do [ -z "$(gh run list -R ${{ github.repository }} --workflow puzzle-prove.yml --status in_progress --json databaseId -q '.[].databaseId')" ] && break; sleep 60; done
          git config user.name "madfut-tools bot"
          git config user.email "actions@users.noreply.github.com"
          for t in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            node scripts/pz_max.js merge docs/puzzles_max.json found/*.json
            python3 scripts/pz_icons_next.py tried "$BLOCK"   # count a try for each puzzle of this block not proven yet
            git add docs/puzzles_max.json
            git diff --cached --quiet && break
            git commit -qm "Puzzle top scores (Icons check)" && git push -q && break
            sleep 20
          done
      - name: Next block
        run: |
          if [ "$(python3 scripts/pz_icons_next.py | grep '^ids=' | cut -d= -f2)" != "[]" ]; then gh workflow run puzzle-icons.yml -R ${{ github.repository }} --ref main; fi
