name: Puzzle top scores (prove)

# A long search for each puzzle whose top score isn't proven yet, one machine each, started from its best known squad.
# It either proves that squad is the top score or finds a better one. Results merge into docs/puzzles_max.json.
on:
  push:
    branches: [main]
    paths: [".github/workflows/puzzle-prove.yml"]
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes per puzzle"
        default: "300"

permissions:
  contents: write

concurrency:
  group: puzzle-prove
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-26.04
    outputs:
      ids: ${{ steps.l.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: echo "ids=$(python3 -c "import json;m=json.load(open('docs/puzzles_max.json'))['puzzles'];P=json.load(open('docs/puzzles.json'));print(json.dumps([p['id'] for s in P['sets'] for p in s['puzzles'] if not m.get(p['id'],{}).get('proven')]))")" >> $GITHUB_OUTPUT

  prove:
    needs: list
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        id: ${{ fromJson(needs.list.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install ortools==9.15.6755
      - run: |
          node scripts/pz_max.js elig elig.json
          python3 scripts/pz_max.py prove "${{ matrix.id }}" "$(( ${{ github.event.inputs.minutes || '300' }} * 60 ))" elig.json "prove_${{ matrix.id }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prove-${{ matrix.id }}
          path: prove_${{ matrix.id }}.json
          if-no-files-found: ignore

  publish:
    needs: prove
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { path: found, pattern: prove-*, merge-multiple: true }
      - run: |
          node scripts/pz_max.js merge docs/puzzles_max.json found/*.json
          git config user.name "madfut-tools bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/puzzles_max.json
          git diff --cached --quiet || (git commit -m "Puzzle top scores (proven)" && git pull --rebase && git push)
