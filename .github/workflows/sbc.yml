name: Solve SBCs

on:
  push:
    paths:
      - "config/sbc.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build.py sbc && python scripts/build.py index
      - name: Save results
        run: |
          git config user.name "madfut-tools bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/results
          git diff --cached --quiet || (git commit -m "Update SBC results" && git pull --rebase && git push)
