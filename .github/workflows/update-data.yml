name: Update card data

on:
  schedule:
    - cron: "17 3 * * *"     # every day at 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/sources.json"
      - "scripts/update_data.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download latest cards from madfutdata
        run: python scripts/update_data.py
      - name: Save if anything changed
        run: |
          git config user.name "madfut-tools bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cards.json docs/cards.json docs/names.json
          git diff --cached --quiet || (git commit -m "Update card data" && git pull --rebase && git push)
