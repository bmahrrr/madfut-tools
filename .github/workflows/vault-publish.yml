name: Publish vault artifacts

# Re-publishes a finished "Build vault week" run into the vault without rebuilding:
# add config/vault-publish/<name>.json = {"run_id": 123, "file": "config/vault/<week>.json"}.
on:
  push:
    branches: [main]
    paths:
      - "config/vault-publish/*.json"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: f
        run: |
          F=$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'config/vault-publish/*.json' | head -1)
          echo "run_id=$(python3 -c "import json;print(json.load(open('$F'))['run_id'])")" >> $GITHUB_OUTPUT
          echo "file=$(python3 -c "import json;print(json.load(open('$F'))['file'])")" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.f.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts
      - name: Save to the vault
        run: |
          F="${{ steps.f.outputs.file }}"
          W=$(python3 -c "import json;print(json.load(open('$F'))['week'])")
          mkdir -p "docs/vault/$W"
          find artifacts -name '*.json' -exec cp {} "docs/vault/$W/" \;
          cp "$F" "docs/vault/$W/week.json"
          python3 - "$W" <<'PY'
          import json, os, sys
          w = sys.argv[1]; vi = "docs/vault/index.json"
          v = json.load(open(vi)) if os.path.exists(vi) else {"weeks": []}
          files = sorted(f for f in os.listdir(f"docs/vault/{w}") if f.startswith(("myclub_", "sim_")))
          note = json.load(open(f"docs/vault/{w}/week.json")).get("note", "")
          v["weeks"] = [x for x in v["weeks"] if x["week"] != w] + [{"week": w, "files": files, "note": note}]
          v["weeks"].sort(key=lambda x: x["week"], reverse=True)
          json.dump(v, open(vi, "w"), indent=1)
          PY
          git config user.name "madfut-tools bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/vault
          git diff --cached --quiet || (git commit -m "Vault week $W" && git pull --rebase && git push)
